name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS App and Generate IPA
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up CocoaPods & Build
      run: |
        pod install
        xcodebuild -workspace Gym.xcworkspace -scheme Gym -sdk iphoneos -configuration Release archive -archivePath $PWD/build/Gym.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Export IPA for Sideloading
      run: |
        mkdir -p Payload
        mv build/Gym.xcarchive/Products/Applications/Gym.app Payload/
        zip -r GymApp.ipa Payload/

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GymApp-IPA
        path: GymApp.ipa
