name: Build iOS App
on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App and Generate IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: loc
        run: |
          PROJ=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" -not -path "./.git/*" | head -1)
          if [ -z "$PROJ" ]; then
            echo "No .xcodeproj found. Repo files:"
            find . -maxdepth 3 -not -path "./.git/*"
            exit 1
          fi
          DIR=$(dirname "$PROJ"); NAME=$(basename "$PROJ" .xcodeproj)
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          if [ ! -f "$DIR/Podfile" ]; then
            P=$(find . -name Podfile -not -path "*/Pods/*" | head -1)
            [ -n "$P" ] && cp "$P" "$DIR/Podfile"
          fi
          echo "Project dir: $DIR"; ls "$DIR"

      - name: Pod install
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          if [ -f Podfile ]; then pod install; fi

      - name: Build unsigned IPA
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          N="${{ steps.loc.outputs.name }}"
          if [ -d "$N.xcworkspace" ]; then T="-workspace $N.xcworkspace"; else T="-project $N.xcodeproj"; fi
          xcodebuild $T -list || true
          xcodebuild $T -scheme "$N" -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Gym.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Gym-ipa
          path: ${{ steps.loc.outputs.dir }}/Gym.ipa
